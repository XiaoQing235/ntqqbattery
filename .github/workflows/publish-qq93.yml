name: Publish QQ93 experimental release
on:
  push:
    paths:
      - '.github/workflows/publish-qq93.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify source build and download tested artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh run watch 43396263498 --exit-status
          test "$(gh run view 43396263498 --json headSha --jq .headSha)" = "d9adaea543dae89732a8195a445a590c447c512c"
          gh run download 43396263498 --name NTQQBattery-qq93-release --dir output
          cd output
          sha256sum -c SHA256SUMS
      - name: Upload verified assets to existing release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release view v0.7.4-qq93.2
          gh release upload v0.7.4-qq93.2 output/NTQQBattery-qq93-release.apk output/SHA256SUMS output/INSTALL-NOTES.txt
          gh release view v0.7.4-qq93.2 --json url,assets
