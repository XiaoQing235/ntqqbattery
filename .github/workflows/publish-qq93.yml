name: Publish QQ93 experimental release
on:
  push:
    paths:
      - '.github/workflows/publish-qq93.yml'
  workflow_dispatch:
permissions:
  contents: write
  actions: read
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Verify source build and download tested artifact
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh run watch 43394593812 --exit-status
          test "$(gh run view 43394593812 --json headSha --jq .headSha)" = "7c48a766ba2a009857848b44589287abbaa9bb03"
          gh run download 43394593812 --name NTQQBattery-qq93-release --dir output
          cd output
          sha256sum -c SHA256SUMS
      - name: Publish experimental release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          cat > notes.md <<'EOF'
          ## QQ 9.3 settings-entry adaptation
          - Independently implemented settings-provider discovery and item constructor/callback matching, informed by TSBattery's compatibility approach.
          - Preserves NTQQBattery's settings page, storage, and battery-saving features.
          - Unit tests and optimized Release build passed; APK signature verified.
          - QQ 9.3.10.37675 has not yet been tested on a real device.

          **Installation / signing:** This experimental APK is signed with a disposable build key, not the upstream key. It cannot replace an installation signed by upstream or a different build. No signing private key is published or retained for future upgrades. Do not clear QQ data.

          This is an unofficial experimental fork build. Existing upstream notices remain unchanged; no new license is asserted over upstream code.
          EOF
          gh release create v0.7.4-qq93.1 output/NTQQBattery-qq93-release.apk output/SHA256SUMS output/INSTALL-NOTES.txt \
            --target 7c48a766ba2a009857848b44589287abbaa9bb03 \
            --title "NTQQBattery QQ 9.3 settings entry · experimental 1" \
            --notes-file notes.md --prerelease
